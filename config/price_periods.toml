## 時間電價時段規則
#
# 電價時段規則由本檔讀入，程式中不寫死。
# `data/raw/時間電價日曆表NEW.xlsx` 給的是**每日的日別**（平日 / 週六 / 週日及離峰日），
# 不含日內的時段切分；日內時段規則依台電公告的時間電價制度記錄於本檔。
#
# 放在 config/ 而非 data/ 的理由：這是人工整理的制度規則，不是原始資料。
#
# 時段以 [start, end) 表示（左閉右開），"24:00" 代表當日結束。

[summer]
# 夏月：5/16 ~ 10/15（含端點）。其餘為非夏月。
start = "05-16"
end = "10-15"

[summer_low_voltage]
# 低壓用戶的夏月比高壓短。系統負載同時包含兩者，故一年內其實有三種
# regime，而不是二元的「夏月／非夏月」：
#
#   盛夏       6/01–9/30            高低壓皆為夏月
#   僅高壓夏月  5/16–5/31、10/1–10/15  只有高壓算夏月
#   非夏月     其餘
#
# **目標期 2026/10/1–10/3 正好落在「僅高壓夏月」那一段。**
# 實測平日 t_night 落在 17:10 的比例：盛夏 81.3%、僅高壓 48.1%、非夏月 16.4%，
# 而現行的二元 is_summer 把前兩者混成同一組——那正是決定目標期的池子。
start = "06-01"
end = "09-30"

# ---------------------------------------------------------------------------
# 日內時段。key 為日曆表的「平假日」欄位值。
# 未被任何區間涵蓋的時間一律為「離峰」。
# ---------------------------------------------------------------------------

[bands.summer."平日"]
"尖峰" = [["16:00", "22:00"]]
"半尖峰" = [["09:00", "16:00"], ["22:00", "24:00"]]

[bands.summer."週六"]
# 夏月週六為單一連續區間 09:00–24:00，與夏月平日（切成 09–16 與 22–24 兩段）不同。
"週六半尖峰" = [["09:00", "24:00"]]

[bands.summer."週日及離峰日"]
# 全日離峰

[bands.non_summer."平日"]
"半尖峰" = [["06:00", "11:00"], ["14:00", "24:00"]]

[bands.non_summer."週六"]
"週六半尖峰" = [["06:00", "11:00"], ["14:00", "24:00"]]

[bands.non_summer."週日及離峰日"]
# 全日離峰

# ---------------------------------------------------------------------------
# 與預測目標窗口的重疊關係（供建模參考，非規則本身）
#
# 目標期 2026/10/1(四)、10/2(五) 為夏月平日，10/3(六) 為夏月週六。
#
#   日尖峰窗口 11:00–17:00：夏月平日的 11:00–16:00 為半尖峰、16:00–17:00 為尖峰。
#     → 窗口內橫跨一個電價切換點（16:00），且切換點落在 t_day 第三個叢集
#       （16:10–17:00）的起點附近。
#   夜尖峰窗口 17:10–21:00：夏月平日**全段**為尖峰（16:00–22:00 內）。
#     → 窗口內無切換點。
#   夏月週六：09:00–24:00 全段為週六半尖峰，00:00–09:00 為離峰。
#     → 日尖峰窗口（11:00–17:00）與夜尖峰窗口（17:10–21:00）在週六**全段同一費率**，
#       窗口內完全沒有價格切換點；平日則在 16:00 有一個半尖峰→尖峰的跳升。
#       這個制度差異正是「週六與平日的 t_day / t_night 分布明顯不同」的合理成因。
# ---------------------------------------------------------------------------
